<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My To-Do App</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: "Segoe UI", Arial, sans-serif;
    min-height: 100vh;
    color: #f5f3ff;
    background:
        radial-gradient(circle at 10% 10%, rgba(124, 58, 237, 0.20), transparent 30%),
        radial-gradient(circle at 90% 20%, rgba(236, 72, 153, 0.15), transparent 30%),
        radial-gradient(circle at 50% 100%, rgba(59, 130, 246, 0.12), transparent 35%),
        #08080d;
    padding: 35px 15px;
    transition: 0.4s;
}

body.light {
    color: #1f1735;
    background:
        radial-gradient(circle at 10% 10%, rgba(167, 139, 250, 0.25), transparent 30%),
        radial-gradient(circle at 90% 20%, rgba(244, 114, 182, 0.20), transparent 30%),
        #f7f5ff;
}

.container {
    max-width: 1100px;
    margin: auto;
}

/* HEADER */

.header {
    text-align: center;
    margin-bottom: 30px;
}

.logo {
    width: 75px;
    height: 75px;
    margin: 0 auto 15px;
    border-radius: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    background: linear-gradient(135deg, #7c3aed, #ec4899);
    box-shadow:
        0 0 25px rgba(124, 58, 237, 0.45),
        0 0 60px rgba(236, 72, 153, 0.18);
}

h1 {
    font-size: clamp(32px, 6vw, 52px);
    font-weight: 800;
    letter-spacing: -2px;
    background: linear-gradient(90deg, #c4b5fd, #f9a8d4, #93c5fd);
    -webkit-background-clip: text;
    color: transparent;
}

.subtitle {
    margin-top: 8px;
    color: #9692a8;
    font-size: 15px;
}

/* DARK BUTTON */

.top-actions {
    display: flex;
    justify-content: center;
    margin-top: 18px;
}

.dark-btn {
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.06);
    color: #fff;
    padding: 11px 20px;
    border-radius: 30px;
    cursor: pointer;
    backdrop-filter: blur(15px);
    transition: 0.3s;
}

.dark-btn:hover {
    transform: translateY(-2px);
    background: rgba(124,58,237,0.25);
    box-shadow: 0 8px 25px rgba(124,58,237,0.2);
}

/* MAIN CARD */

.main-card {
    background: rgba(18, 17, 27, 0.78);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 28px;

        0 25px 70px rgba(0,0,0,0.45),
        inset 0 1px 0 rgba(255,255,255,0.04);

}

body.light .main-card {
    background: rgba(255,255,255,0.75);
    border-color: rgba(100,80,150,0.12);
    box-shadow: 0 20px 50px rgba(70,50,120,0.12);
}

/* ADD AREA */

.add-title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 15px;
}

.add-box {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 1fr auto;

}

input,
select {
    width: 100%;

    outline: none;

    padding: 13px 14px;
    color: #fff;

}

body.light input,
body.light select {
    color: #222;
    background: rgba(255,255,255,0.8);

}

input:focus,
select:focus {

.add-btn {
    border: none;

}

.add-btn:hover {

    box-shadow: 0 12px 30px rgba(236,72,153,0.3);
}

/* DIVIDER */

.divider {
    height: 1px;

        90deg,

        rgba(167,139,250,0.3),

    );
}

/* SEARCH */

.search-box {
    margin-bottom: 18px;
}

.search-box input {
    padding: 15px 18px;

}

/* FILTERS */

.filter-title {

}

.filters {
    display: flex;

}

.filter-btn {
    border: 1px solid rgba(255,255,255,0.08);

.filter-btn:hover,
.filter-btn.active {

.sort-area {
    margin-top: 16px;

.progress-section {

.progress-top {

.progress-fill {
    height: 100%;
    width: 0%;

}

.task-list {

}

.task-card {

    padding: 20px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.075);
    background:
        linear-gradient(
            135deg,

    backdrop-filter: blur(15px);

}

.task-card::before {
    content: "";

}

.task-card:hover {

    border-color: rgba(167,139,250,0.25);

}

body.light .task-card {

}

.task-main {

    gap: 14px;
}

.task-check {

    height: 23px;

}

.task-check.completed {

}

.task-check.completed::after {

    font-weight: bold;
    color: white;
}

.task-title {
    font-size: 17px;
    font-weight: 650;

    word-break: break-word;
}

.task-title.completed {
    color: #777384;
    text-decoration: line-through;
}

.task-info {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;

}

.badge {

    font-weight: 700;
}

.category-work {
    background: rgba(59,130,246,0.13);

}

.category-study {
    background: rgba(139,92,246,0.15);

}

.category-personal {

}

.priority-high {
    background: rgba(239,68,68,0.14);
    color: #fca5a5;
}

.priority-medium {
    background: rgba(245,158,11,0.14);
    color: #fcd34d;
}

.priority-low {
    background: rgba(34,197,94,0.13);
    color: #86efac;
}

.date-badge {
    background: rgba(255,255,255,0.07);
    color: #aaa5b8;
}

/* ACTION BUTTONS */

.task-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 16px;
    padding-left: 37px;
}

.action-btn {
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.05);
    color: #ddd8e8;
    padding: 8px 12px;
    border-radius: 11px;
    cursor: pointer;
    font-size: 12px;
    transition: 0.25s;
}

.action-btn:hover {
    transform: translateY(-2px);
}

.complete-btn:hover {
    background: rgba(34,197,94,0.15);
    border-color: rgba(34,197,94,0.3);
}

.edit-btn:hover {
    background: rgba(59,130,246,0.15);
    border-color: rgba(59,130,246,0.3);
}

.delete-btn:hover {
    background: rgba(239,68,68,0.15);
    border-color: rgba(239,68,68,0.3);
}

/* EMPTY */

.empty {
    text-align: center;
    padding: 55px 20px;
    color: #858091;
}

.empty-icon {
    font-size: 50px;
    margin-bottom: 12px;
}

/* FOOTER */

.footer {
    text-align: center;
    margin-top: 22px;
    color: #716d7c;
    font-size: 12px;
}

/* MOBILE */

@media (max-width: 850px) {
    .add-box {
        grid-template-columns: 1fr 1fr;
    }

    .add-box input:first-child {
        grid-column: 1 / -1;
    }

    .add-btn {
        grid-column: 1 / -1;
    }
}

@media (max-width: 550px) {
    body {
        padding: 20px 10px;
    }

    .main-card {
        padding: 17px;
        border-radius: 22px;
    }

    .add-box {
        grid-template-columns: 1fr;
    }

    .add-box input:first-child,
    .add-btn {
        grid-column: auto;
    }

    .task-card {
        padding: 17px;
    }

    .task-actions {
        padding-left: 0;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">

        <h1>My To-Do App</h1>

        <p class="subtitle">

        <div class="search-box">

            <input
                id="searchInput"

            >

        </div>

        <div class="filter-title">

        </div>

        <div class="filters">

            <button class="filter-btn active" id="allBtn">

            </button>

            <button class="filter-btn" id="pendingBtn">
                ⏳ Pending
            </button>

            </button>

        </div>

        <div class="filter-title">
            Category
        </div>

        <div class="filters">

            <button class="filter-btn active" id="categoryAllBtn">

            </button>

            <button class="filter-btn" id="workBtn">
                💼 Work
            </button>

            <button class="filter-btn" id="studyBtn">

            </button>

            </button>

        <!-- PRIORITY -->

        <div class="filter-title">
            Priority
        </div>

        <div class="filters">

            <button class="filter-btn active" id="priorityAllBtn">
                All
            </button>

            <button class="filter-btn" id="highBtn">
                🔥 High
            </button>

            <button class="filter-btn" id="mediumBtn">
                ⚡ Medium
            </button>

            </button>

                <div
                    class="progress-fill"
                    id="progressFill">

        <div class="task-list" id="taskList"></div>

    </div>


    <div class="footer">
        Built with 💜 • Stay productive, stay unstoppable.
    </div>

</div>


<script>

/* =========================
   DATA
========================= */

let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

let currentStatus = "all";
let currentCategory = "all";
let currentPriority = "all";
let currentSort = "default";


/* =========================
   ELEMENTS
========================= */

const taskInput = document.getElementById("taskInput");
const categoryInput = document.getElementById("categoryInput");
const priorityInput = document.getElementById("priorityInput");
const dateInput = document.getElementById("dateInput");
const addBtn = document.getElementById("addBtn");

const searchInput = document.getElementById("searchInput");

const taskList = document.getElementById("taskList");

const progressFill = document.getElementById("progressFill");
const progressText = document.getElementById("progressText");

const darkBtn = document.getElementById("darkBtn");
const sortInput = document.getElementById("sortInput");


/* =========================
   SAVE
========================= */

function saveTasks() {

    localStorage.setItem(
        "tasks",
        JSON.stringify(tasks)
    );

}


/* =========================
   ADD TASK
========================= */

function addTask() {

    const title = taskInput.value.trim();

    if (title === "") {

        alert("Please enter a task!");

        taskInput.focus();

        return;
    }


    const newTask = {

        id: Date.now(),

        title: title,

        category: categoryInput.value,

        priority: priorityInput.value,

        date: dateInput.value,

        completed: false

    };


    tasks.push(newTask);

    saveTasks();

    taskInput.value = "";

    dateInput.value = "";

    displayTasks();

    taskInput.focus();

}


addBtn.onclick = addTask;


/* ENTER TO ADD */

taskInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            event.preventDefault();

            addTask();

        }

    }
);


/* =========================
   DELETE TASK
========================= */

function deleteTask(id) {

    const confirmDelete =
        confirm("Delete this task?");

    if (!confirmDelete) return;


    tasks = tasks.filter(
        function(task) {

            return task.id !== id;

        }
    );


    saveTasks();

    displayTasks();

}


/* =========================
   COMPLETE TASK
========================= */

function toggleTask(id) {

    tasks = tasks.map(
        function(task) {

            if (task.id === id) {

                task.completed = !task.completed;

            }

            return task;

        }
    );


    saveTasks();

    displayTasks();

}


/* =========================
   EDIT TASK
========================= */

function editTask(id) {

    const task = tasks.find(
        function(task) {

            return task.id === id;

        }
    );


    if (!task) return;


    const newTitle = prompt(
        "Edit your task:",
        task.title
    );


    if (
        newTitle !== null &&
        newTitle.trim() !== ""
    ) {

        task.title = newTitle.trim();

        saveTasks();

        displayTasks();

    }

}


/* =========================
   FILTER BUTTON HELPER
========================= */

function setActive(buttonId, group) {

    group.forEach(
        function(id) {

            document
                .getElementById(id)
                .classList.remove("active");

        }
    );


    document
        .getElementById(buttonId)
        .classList.add("active");

}


/* =========================
   STATUS FILTERS
========================= */

document.getElementById("allBtn").onclick =
function() {

    currentStatus = "all";

    setActive(
        "allBtn",
        ["allBtn", "pendingBtn", "completedBtn"]
    );

    displayTasks();

};


document.getElementById("pendingBtn").onclick =
function() {

    currentStatus = "pending";

    setActive(
        "pendingBtn",
        ["allBtn", "pendingBtn", "completedBtn"]
    );

    displayTasks();

};


document.getElementById("completedBtn").onclick =
function() {

    currentStatus = "completed";

    setActive(
        "completedBtn",
        ["allBtn", "pendingBtn", "completedBtn"]
    );

    displayTasks();

};


/* =========================
   CATEGORY FILTERS
========================= */

document.getElementById("categoryAllBtn").onclick =
function() {

    currentCategory = "all";

    setActive(
        "categoryAllBtn",
        [
            "categoryAllBtn",
            "workBtn",
            "studyBtn",
            "personalBtn"
        ]
    );

    displayTasks();

};


document.getElementById("workBtn").onclick =
function() {

    currentCategory = "Work";

    setActive(
        "workBtn",
        [
            "categoryAllBtn",
            "workBtn",
            "studyBtn",
            "personalBtn"
        ]
    );

    displayTasks();

};


document.getElementById("studyBtn").onclick =
function() {

    currentCategory = "Study";

    setActive(
        "studyBtn",
        [
            "categoryAllBtn",
            "workBtn",
            "studyBtn",
            "personalBtn"
        ]
    );

    displayTasks();

};


document.getElementById("personalBtn").onclick =
function() {

    currentCategory = "Personal";

    setActive(
        "personalBtn",
        [
            "categoryAllBtn",
            "workBtn",
            "studyBtn",
            "personalBtn"
        ]
    );

    displayTasks();

};


/* =========================
   PRIORITY FILTERS
========================= */

document.getElementById("priorityAllBtn").onclick =
function() {

    currentPriority = "all";

    setActive(
        "priorityAllBtn",
        [
            "priorityAllBtn",
            "highBtn",
            "mediumBtn",
            "lowBtn"
        ]
    );

    displayTasks();

};


document.getElementById("highBtn").onclick =
function() {

    currentPriority = "High";

    setActive(
        "highBtn",
        [
            "priorityAllBtn",
            "highBtn",
            "mediumBtn",
            "lowBtn"
        ]
    );

    displayTasks();

};


document.getElementById("mediumBtn").onclick =
function() {

    currentPriority = "Medium";

    setActive(
        "mediumBtn",
        [
            "priorityAllBtn",
            "highBtn",
            "mediumBtn",
            "lowBtn"
        ]
    );

    displayTasks();

};


document.getElementById("lowBtn").onclick =
function() {

    currentPriority = "Low";

    setActive(
        "lowBtn",
        [
            "priorityAllBtn",
            "highBtn",
            "mediumBtn",
            "lowBtn"
        ]
    );

    displayTasks();

};


/* =========================
   SEARCH
========================= */

searchInput.addEventListener(
    "input",
    function() {

        displayTasks();

    }
);


/* =========================
   SORT
========================= */

sortInput.addEventListener(
    "change",
    function() {

        currentSort = sortInput.value;

        displayTasks();

    }
);


/* =========================
   DISPLAY TASKS
========================= */

function displayTasks() {

    let filteredTasks = [...tasks];


    /* SEARCH */

    const search =
        searchInput.value
        .trim()
        .toLowerCase();


    if (search !== "") {

        filteredTasks =
            filteredTasks.filter(
                function(task) {

                    return task.title
                        .toLowerCase()
                        .includes(search);

                }
            );

    }


    /* STATUS */

    if (currentStatus === "pending") {

        filteredTasks =
            filteredTasks.filter(
                function(task) {

                    return !task.completed;

                }
            );

    }


    if (currentStatus === "completed") {

        filteredTasks =
            filteredTasks.filter(
                function(task) {

                    return task.completed;

                }
            );

    }


    /* CATEGORY */

    if (currentCategory !== "all") {

        filteredTasks =
            filteredTasks.filter(
                function(task) {

                    return task.category === currentCategory;

                }
            );

    }


    /* PRIORITY */

    if (currentPriority !== "all") {

        filteredTasks =
            filteredTasks.filter(
                function(task) {

                    return task.priority === currentPriority;

                }
            );

    }


    /* SORT */

    if (currentSort === "high") {

        const order = {
            High: 1,
            Medium: 2,
            Low: 3
        };

        filteredTasks.sort(
            function(a, b) {

                return order[a.priority] -
                       order[b.priority];

            }
        );

    }


    if (currentSort === "low") {

        const order = {
            High: 1,
            Medium: 2,
            Low: 3
        };

        filteredTasks.sort(
            function(a, b) {

                return order[b.priority] -
                       order[a.priority];

            }
        );

    }


    if (currentSort === "newest") {

        filteredTasks.sort(
            function(a, b) {

                return b.id - a.id;

            }
        );

    }


    if (currentSort === "oldest") {

        filteredTasks.sort(
            function(a, b) {

                return a.id - b.id;

            }
        );

    }


    /* EMPTY */

    if (filteredTasks.length === 0) {

        taskList.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    ✨
                </div>

                <h3>
                    No tasks found
                </h3>

                <p>
                    Your task list is waiting for something amazing.
                </p>

            </div>

        `;

        updateProgress();

        return;

    }


    /* RENDER */

    taskList.innerHTML =
        filteredTasks.map(
            function(task) {

                let categoryClass =
                    "category-" +
                    task.category.toLowerCase();

                let priorityClass =
                    "priority-" +
                    task.priority.toLowerCase();


                return `

                    <div class="task-card">

                        <div class="task-main">

                            <div
                                class="task-check ${
                                    task.completed
                                    ? "completed"
                                    : ""
                                }"
                                onclick="toggleTask(${task.id})"
                            ></div>


                            <div style="flex:1">

                                <div
                                    class="task-title ${
                                        task.completed
                                        ? "completed"
                                        : ""
                                    }"
                                >
                                    ${escapeHTML(task.title)}
                                </div>


                                <div class="task-info">

                                    <span
                                        class="badge ${categoryClass}"
                                    >
                                        ${
                                            task.category === "Work"
                                            ? "💼"
                                            : task.category === "Study"
                                            ? "📚"
                                            : "💖"
                                        }
                                        ${task.category}
                                    </span>


                                    <span
                                        class="badge ${priorityClass}"
                                    >
                                        ${
                                            task.priority === "High"
                                            ? "🔥"
                                            : task.priority === "Medium"
                                            ? "⚡"
                                            : "🌱"
                                        }
                                        ${task.priority}
                                    </span>


                                    ${
                                        task.date
                                        ?
                                        `
                                        <span class="badge date-badge">
                                            📅 ${task.date}
                                        </span>
                                        `
                                        :
                                        ""
                                    }

                                </div>

                            </div>

                        </div>


                        <div class="task-actions">

                            <button
                                class="action-btn complete-btn"
                                onclick="toggleTask(${task.id})"
                            >
                                ${
                                    task.completed
                                    ? "↩️ Undo"
                                    : "✅ Complete"
                                }
                            </button>


                            <button
                                class="action-btn edit-btn"
                                onclick="editTask(${task.id})"
                            >
                                ✏️ Edit
                            </button>


                            <button
                                class="action-btn delete-btn"
                                onclick="deleteTask(${task.id})"
                            >
                                🗑️ Delete
                            </button>

                        </div>

                    </div>

                `;

            }
        ).join("");


    updateProgress();

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


/* =========================
   PROGRESS
========================= */

function updateProgress() {

    const total = tasks.length;

    const completed =
        tasks.filter(
            function(task) {

                return task.completed;

            }
        ).length;


    let percentage = 0;


    if (total > 0) {

        percentage =
            Math.round(
                (completed / total) * 100
            );

    }


    progressFill.style.width =
        percentage + "%";


    progressText.textContent =
        percentage + "%";

}


/* =========================
   DARK MODE
========================= */

function updateDarkButton() {

    if (document.body.classList.contains("light")) {

        darkBtn.textContent =
            "🌙 Dark Mode";

    } else {

        darkBtn.textContent =
            "☀️ Light Mode";

    }

}


darkBtn.onclick =
function() {

    document.body.classList.toggle("light");

    const isLight =
        document.body.classList.contains("light");


    localStorage.setItem(
        "darkMode",
        isLight ? "light" : "dark"
    );


    updateDarkButton();

};


/* =========================
   LOAD DARK MODE
========================= */

const savedMode =
    localStorage.getItem("darkMode");


if (savedMode === "light") {

    document.body.classList.add("light");

}


updateDarkButton();


/* =========================
   INITIAL DISPLAY
========================= */

displayTasks();

</script>

</body>
</html>
