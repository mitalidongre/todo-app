<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My To-Do App</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
    transition: 0.3s;
}

.container {
    width: 90%;
    max-width: 900px;
    margin: 40px auto;
}

h1 {
    text-align: center;
    margin-bottom: 25px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 15px;
    margin-bottom: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

input, select, button {
    padding: 11px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 14px;
}

input {
    width: 100%;
    margin-bottom: 10px;
}

.row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
}

button {
    cursor: pointer;
    border: none;
}

#addBtn {
    width: 100%;
    margin-top: 10px;
    background: #222;
    color: white;
}

.filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 15px;
}

.filters button {
    background: #eee;
}

.filters button:hover {
    background: #ddd;
}

.task {
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 12px;
}

.task.completed {
    opacity: 0.65;
}

.task.completed .task-title {
    text-decoration: line-through;
}

.task-title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 8px;
}

.task-info {
    font-size: 13px;
    color: #666;
    margin-bottom: 10px;
}

.task-actions {
    display: flex;
    gap: 8px;
}

.complete-btn {
    background: #4caf50;
    color: white;
}

.edit-btn {
    background: #2196f3;
    color: white;
}

.delete-btn {
    background: #f44336;
    color: white;
}

.progress-box {
    margin-top: 15px;
}

.progress-bar {
    width: 100%;
    height: 18px;
    background: #ddd;
    border-radius: 20px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    width: 0%;
    background: #4caf50;
    transition: width 0.3s;
}

#darkBtn {
    display: block;
    margin: 0 auto 20px;
    background: #222;
    color: white;
}

.empty {
    text-align: center;
    color: #777;
    padding: 20px;
}

body.dark {
    background: #181818;
    color: #eee;
}

body.dark .card,
body.dark .task {
    background: #242424;
    border-color: #444;
}

body.dark input,
body.dark select {
    background: #333;
    color: white;
    border-color: #555;
}

body.dark .filters button {
    background: #444;
    color: white;
}

body.dark .task-info {
    color: #bbb;
}

body.dark .progress-bar {
    background: #444;
}

@media (max-width: 650px) {
    .row {
        grid-template-columns: 1fr;
    }

    .container {
        width: 94%;
        margin: 20px auto;
    }

    .task-actions {
        flex-wrap: wrap;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>📝 My To-Do App</h1>

<button id="darkBtn">🌙 Dark Mode</button>

<div class="card">

<input
    type="text"
    id="taskInput"
    placeholder="Enter your task..."
>

<div class="row">

<select id="categoryInput">
    <option value="Work">💼 Work</option>
    <option value="Study">📚 Study</option>
    <option value="Personal">🏠 Personal</option>
</select>

<select id="priorityInput">
    <option value="High">🔴 High</option>
    <option value="Medium" selected>🟡 Medium</option>
    <option value="Low">🟢 Low</option>
</select>

<input type="date" id="dateInput">

</div>

<button id="addBtn">➕ Add Task</button>

</div>


<div class="card">

<input
    type="text"
    id="searchInput"
    placeholder="🔍 Search task..."
>

<div class="filters">

<button onclick="setStatus('all')">
All
</button>

<button onclick="setStatus('pending')">
Pending
</button>

<button onclick="setStatus('completed')">
Completed
</button>

</div>


<div class="filters">

<button onclick="setCategory('all')">
📂 All Categories
</button>

<button onclick="setCategory('Work')">
💼 Work
</button>

<button onclick="setCategory('Study')">
📚 Study
</button>

<button onclick="setCategory('Personal')">
🏠 Personal
</button>

</div>


<div class="filters">

<button onclick="setPriority('all')">
⭐ All Priority
</button>

<button onclick="setPriority('High')">
🔴 High
</button>

<button onclick="setPriority('Medium')">
🟡 Medium
</button>

<button onclick="setPriority('Low')">
🟢 Low
</button>

</div>


<div class="filters">

<select id="sortInput">

<option value="default">
↕️ Default
</option>

<option value="high">
🔴 High → Low
</option>

<option value="low">
🟢 Low → High
</option>

<option value="newest">
🆕 Newest First
</option>

<option value="oldest">
📅 Oldest First
</option>

</select>

</div>


<div class="progress-box">

<p>
Progress:
<span id="progressText">0%</span>
</p>

<div class="progress-bar">

<div
    class="progress-fill"
    id="progressFill">
</div>

</div>

</div>

</div>


<div class="card">

<div id="taskList"></div>

</div>

</div>


<script>

let tasks =
JSON.parse(localStorage.getItem("tasks")) || [];

let currentStatus = "all";
let currentCategory = "all";
let currentPriority = "all";
let currentSort = "default";


const taskInput =
document.getElementById("taskInput");

const categoryInput =
document.getElementById("categoryInput");

const priorityInput =
document.getElementById("priorityInput");

const dateInput =
document.getElementById("dateInput");

const searchInput =
document.getElementById("searchInput");

const sortInput =
document.getElementById("sortInput");

const taskList =
document.getElementById("taskList");

const addBtn =
document.getElementById("addBtn");

const darkBtn =
document.getElementById("darkBtn");


function saveTasks() {

    localStorage.setItem(
        "tasks",
        JSON.stringify(tasks)
    );

}


function addTask() {

    const title =
    taskInput.value.trim();

    if (title === "") {

        alert("Please enter a task!");

        taskInput.focus();

        return;
    }


    const newTask = {

        id: Date.now(),

        title: title,

        category: categoryInput.value,

        priority: priorityInput.value,

        date: dateInput.value,

        completed: false

    };


    tasks.push(newTask);

    saveTasks();

    taskInput.value = "";

    dateInput.value = "";

    displayTasks();

    taskInput.focus();

}


addBtn.addEventListener(
    "click",
    addTask
);


taskInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            addTask();

        }

    }
);


searchInput.addEventListener(
    "input",
    displayTasks
);


sortInput.addEventListener(
    "change",
    function() {

        currentSort =
        sortInput.value;

        displayTasks();

    }
);


function setStatus(status) {

    currentStatus = status;

    displayTasks();

}


function setCategory(category) {

    currentCategory = category;

    displayTasks();

}


function setPriority(priority) {

    currentPriority = priority;

    displayTasks();

}


/* COMPLETE / UNCOMPLETE */

function toggleTask(id) {

    tasks =
    tasks.map(function(task) {

        if (task.id === id) {

            task.completed =
            !task.completed;

        }

        return task;

    });


    saveTasks();

    displayTasks();

}


/* DELETE - NO COMPLETE CONDITION */

function deleteTask(id) {

    const answer =
    confirm(
        "Are you sure you want to delete this task?"
    );


    if (!answer) {

        return;

    }


    tasks =
    tasks.filter(function(task) {

        return task.id !== id;

    });


    saveTasks();

    displayTasks();

}


/* EDIT */

function editTask(id) {

    const task =
    tasks.find(function(item) {

        return item.id === id;

    });


    if (!task) {

        return;

    }


    const newTitle =
    prompt(
        "Edit your task:",
        task.title
    );


    if (newTitle === null) {

        return;

    }


    const updatedTitle =
    newTitle.trim();


    if (updatedTitle === "") {

        alert("Task cannot be empty!");

        return;

    }


    task.title =
    updatedTitle;

    saveTasks();

    displayTasks();

}


function getPriorityNumber(priority) {

    if (priority === "High") {

        return 3;

    }

    if (priority === "Medium") {

        return 2;

    }

    return 1;

}


function displayTasks() {

    let filteredTasks =
    [...tasks];


    const searchText =
    searchInput.value
    .trim()
    .toLowerCase();


    if (searchText !== "") {

        filteredTasks =
        filteredTasks.filter(
            function(task) {

                return (

                    task.title
                    .toLowerCase()
                    .includes(searchText)

                    ||

                    task.category
                    .toLowerCase()
                    .includes(searchText)

                    ||

                    task.priority
                    .toLowerCase()
                    .includes(searchText)

                );

            }
        );

    }


    if (currentStatus === "pending") {

        filteredTasks =
        filteredTasks.filter(
            function(task) {

                return !task.completed;

            }
        );

    }


    if (currentStatus === "completed") {

        filteredTasks =
        filteredTasks.filter(
            function(task) {

                return task.completed;

            }
        );

    }


    if (currentCategory !== "all") {

        filteredTasks =
        filteredTasks.filter(
            function(task) {

                return (
                    task.category ===
                    currentCategory
                );

            }
        );

    }


    if (currentPriority !== "all") {

        filteredTasks =
        filteredTasks.filter(
            function(task) {

                return (
                    task.priority ===
                    currentPriority
                );

            }
        );

    }


    if (currentSort === "high") {

        filteredTasks.sort(
            function(a, b) {

                return (
                    getPriorityNumber(b.priority)
                    -
                    getPriorityNumber(a.priority)
                );

            }
        );

    }


    if (currentSort === "low") {

        filteredTasks.sort(
            function(a, b) {

                return (
                    getPriorityNumber(a.priority)
                    -
                    getPriorityNumber(b.priority)
                );

            }
        );

    }


    if (currentSort === "newest") {

        filteredTasks.sort(
            function(a, b) {

                return b.id - a.id;

            }
        );

    }


    if (currentSort === "oldest") {

        filteredTasks.sort(
            function(a, b) {

                return a.id - b.id;

            }
        );

    }


    taskList.innerHTML = "";


    if (filteredTasks.length === 0) {

        taskList.innerHTML =
        '<div class="empty">No tasks found 😊</div>';

    }


    filteredTasks.forEach(
        function(task) {

            const taskDiv =
            document.createElement("div");


            taskDiv.className =
            "task" +
            (
                task.completed
                ? " completed"
                : ""
            );


            const dateText =
            task.date
            ? "📅 " + task.date
            : "📅 No date";


            taskDiv.innerHTML = `

                <div class="task-title">
                    ${escapeHTML(task.title)}
                </div>

                <div class="task-info">
                    ${getCategoryEmoji(task.category)}
                    ${escapeHTML(task.category)}
                    &nbsp; | &nbsp;
                    ${getPriorityEmoji(task.priority)}
                    ${escapeHTML(task.priority)}
                    &nbsp; | &nbsp;
                    ${dateText}
                </div>

                <div class="task-actions">

                    <button
                        class="complete-btn"
                        onclick="toggleTask(${task.id})">

                        ${
                            task.completed
                            ? "↩️ Undo"
                            : "✅ Complete"
                        }

                    </button>


                    <button
                        class="edit-btn"
                        onclick="editTask(${task.id})">

                        ✏️ Edit

                    </button>


                    <button
                        class="delete-btn"
                        onclick="deleteTask(${task.id})">

                        🗑️ Delete

                    </button>

                </div>

            `;


            taskList.appendChild(taskDiv);

        }
    );


    updateProgress();

}


function escapeHTML(text) {

    const div =
    document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


function getCategoryEmoji(category) {

    if (category === "Work") {

        return "💼";

    }

    if (category === "Study") {

        return "📚";

    }

    return "🏠";

}


function getPriorityEmoji(priority) {

    if (priority === "High") {

        return "🔴";

    }

    if (priority === "Medium") {

        return "🟡";

    }

    return "🟢";

}


function updateProgress() {

    const total =
    tasks.length;


    const completed =
    tasks.filter(
        function(task) {

            return task.completed;

        }
    ).length;


    let percentage = 0;


    if (total > 0) {

        percentage =
        Math.round(
            (completed / total) * 100
        );

    }


    document.getElementById(
        "progressText"
    ).textContent =
    percentage + "%";


    document.getElementById(
        "progressFill"
    ).style.width =
    percentage + "%";

}


/* DARK MODE */

darkBtn.addEventListener(
    "click",
    function() {

        document.body
        .classList
        .toggle("dark");


        if (
            document.body
            .classList
            .contains("dark")
        ) {

            darkBtn.textContent =
            "☀️ Light Mode";

            localStorage.setItem(
                "darkMode",
                "true"
            );

        } else {

            darkBtn.textContent =
            "🌙 Dark Mode";

            localStorage.setItem(
                "darkMode",
                "false"
            );

        }

    }
);


if (
    localStorage.getItem("darkMode")
    === "true"
) {

    document.body
    .classList
    .add("dark");

    darkBtn.textContent =
    "☀️ Light Mode";

}


displayTasks();

</script>

</body>
</html>
